name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Firebase config
        run: |
          node -e "
            const fs = require('fs');
            const config = {
              apiKey: process.env.FB_API_KEY,
              authDomain: process.env.FB_AUTH_DOMAIN,
              databaseURL: process.env.FB_DATABASE_URL,
              projectId: process.env.FB_PROJECT_ID,
              storageBucket: process.env.FB_STORAGE_BUCKET,
              messagingSenderId: process.env.FB_MESSAGING_SENDER_ID,
              appId: process.env.FB_APP_ID,
              measurementId: process.env.FB_MEASUREMENT_ID
            };
            const content = 'export const FIREBASE_CONFIG = ' + JSON.stringify(config, null, 2) + ';';
            fs.writeFileSync('src/shared/firebase/firebase.env.ts', content);
            console.log('Firebase config created successfully');
          "
        env:
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FB_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.yml
          retention-days: 5

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            release/*.exe
            release/latest.yml
          body: |
            ## 🎉 Nova Versão do Flex-Kids Manager
            
            ### 📦 Instalação
            Baixe o arquivo `Flex-Kids-Manager-Setup-${{ github.ref_name }}.exe` e execute.
            
            ### ✨ Novidades
            <!-- Adicione as novidades desta versão aqui -->
            
            ### 🔧 Correções
            <!-- Adicione as correções desta versão aqui -->
            
            ---
            
            **Versão:** ${{ github.ref_name }}  
            **Data:** ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
